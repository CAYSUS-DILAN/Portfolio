<!DOCTYPE html>
<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0c0c0c;
  --term: #111111;
  --border: #2a2a2a;
  --green: #39ff14;
  --green-dim: #1a7a08;
  --cyan: #00d4ff;
  --yellow: #f0e040;
  --red: #ff4444;
  --white: #e8e8e8;
  --muted: #555;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg);
}

body {
  font-family: 'JetBrains Mono', monospace;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  position: relative;
}

/* Scanlines */
body::before {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 2px,
    rgba(0,0,0,.12) 2px, rgba(0,0,0,.12) 4px
  );
  pointer-events: none;
  z-index: 100;
}

/* Ambient glow */
body::after {
  content: '';
  position: fixed; inset: 0;
  background: radial-gradient(ellipse at center, rgba(57,255,20,.03) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* ── Terminal window ── */
.terminal {
  width: min(700px, 96vw);
  height: min(560px, 92vh);
  background: var(--term);
  border: 1px solid #222;
  border-radius: 8px;
  box-shadow:
    0 0 0 1px rgba(57,255,20,.07),
    0 0 80px rgba(57,255,20,.05),
    0 30px 90px rgba(0,0,0,.9);
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 10;
  overflow: hidden;
}

/* Title bar */
.titlebar {
  background: #181818;
  border-bottom: 1px solid #222;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.tb-dots { display: flex; gap: 6px; }
.tb-dot  { width: 12px; height: 12px; border-radius: 50%; }
.tb-dot.red    { background: #ff5f57; }
.tb-dot.yellow { background: #febc2e; }
.tb-dot.green  { background: #28c840; }

.tb-title {
  flex: 1; text-align: center;
  font-size: 11px; color: #444;
  letter-spacing: 1px;
}

.tb-title {
  flex: 1; text-align: center;
  font-size: 11px; color: #444;
  letter-spacing: 1px;
}

.tb-conn { font-size: 9px; color: var(--green-dim); letter-spacing: 1px; animation: connGlow 2s ease-in-out infinite; }

@keyframes connGlow {
  0%, 100% { color: #1a7a08; text-shadow: none; }
  50%       { color: #39ff14; text-shadow: 0 0 8px rgba(57,255,20,.8), 0 0 16px rgba(57,255,20,.4); }
}

.tb-dot.green {
  background: #28c840;
  animation: dotGlow 2s ease-in-out infinite;
}

@keyframes dotGlow {
  0%, 100% { background: #1a7a08; box-shadow: none; }
  50%       { background: #39ff14; box-shadow: 0 0 6px rgba(57,255,20,1), 0 0 14px rgba(57,255,20,.6); }
}

/* Output area */
#output {
  flex: 1;
  overflow-y: auto;
  padding: 14px 20px 6px;
  font-size: 12.5px;
  line-height: 1.75;
  color: var(--white);
  scroll-behavior: smooth;
}

#output::-webkit-scrollbar { width: 4px; }
#output::-webkit-scrollbar-track { background: transparent; }
#output::-webkit-scrollbar-thumb { background: #252525; border-radius: 2px; }

/* Input row */
.input-row {
  display: flex;
  align-items: center;
  padding: 8px 20px 12px;
  border-top: 1px solid #1c1c1c;
  flex-shrink: 0;
}

.prompt-static { white-space: nowrap; font-size: 12.5px; }
.pu { color: var(--green); }
.pa { color: var(--white); }
.ph { color: var(--cyan); }
.pp { color: var(--yellow); }

#cmd-input {
  flex: 1;
  background: transparent;
  border: none; outline: none;
  color: var(--white);
  font-family: inherit;
  font-size: 12.5px;
  caret-color: var(--green);
  margin-left: 4px;
}

/* Output line colours */
.g   { color: var(--green); }
.c   { color: var(--cyan); }
.y   { color: var(--yellow); }
.r   { color: var(--red); }
.w   { color: var(--white); }
.dim { color: var(--muted); }
.b   { font-weight: 700; }
.it  { font-style: italic; }

.line       { display: block; }
.line-blank { display: block; height: 5px; }

/* Help table */
.help-table { display: table; }
.help-row   { display: table-row; }
.help-cmd   { display: table-cell; color: var(--cyan); padding-right: 28px; white-space: nowrap; }
.help-desc  { display: table-cell; color: var(--white); }

/* Skill bar */
.bar-g { color: var(--green); }
.bar-e { color: #282828; }

/* Profile image */
.profile-circle {
  width: 72px; height: 72px;
  border-radius: 50%;
  border: 2px solid var(--green);
  overflow: hidden;
  display: inline-block;
  vertical-align: middle;
  margin-bottom: 8px;
  box-shadow: 0 0 12px rgba(57,255,20,.25);
}
.profile-circle img {
  width: 100%; height: 100%;
  object-fit: cover;
}
</style>
</head>
<body>

<div class="terminal">

<script>
const out = document.getElementById('output');
const inp = document.getElementById('cmd-input');

// ── Live session time line ────────────────────────────────────────────
// Formats: "Thu, 14 May 2026 09:35:01 GMT"
function fmtSessionTime(d) {
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const pad = n => String(n).padStart(2,'0');
  // Convert to IST (UTC+5:30)
  const ist = new Date(d.getTime() + (5 * 60 + 30) * 60 * 1000);
  let h = ist.getUTCHours();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${days[ist.getUTCDay()]}, ${ist.getUTCDate()} ${months[ist.getUTCMonth()]} ${ist.getUTCFullYear()} ${pad(h)}:${pad(ist.getUTCMinutes())}:${pad(ist.getUTCSeconds())} ${ampm} IST`;
}

// Creates a live-ticking session line and appends it to output
// Returns the interval id so we can store it
let sessionTimerInterval = null;

function appendLiveSessionLine() {
  // Clear any existing session timer
  if (sessionTimerInterval) clearInterval(sessionTimerInterval);

  const span = document.createElement('span');
  span.className = 'line';
  span.id = 'session-time-line';

  function update() {
    span.innerHTML = `<span class="w">Session opened: ${fmtSessionTime(new Date())}</span>`;
  }
  update();
  out.appendChild(span);
  sessionTimerInterval = setInterval(update, 1000);
}

// ── Data ──────────────────────────────────────────────────────────────
const COMMANDS = {
  whoami: [

    { c:'g b', s:'CAYSUS DILAN RODRIGUES' },
    { c:'w',   s:'━'.repeat(38) },

  ],

    { c:'y b', s:'// EXPERIENCE' },

    { c:'g b', s:'Junior Engineer' },
    // FIX 3: AvancerPI Solutions as hyperlink
    { c:'c',   s:'  ', link:'https://avancerpi.com/', linkText:'AvancerPI Solutions', suffix:'  ·  March 2026 – Present' },
     { blank: true },
    { c:'g b', s:'DevOps Intern' },

  ],

    { c:'w',   s:'━'.repeat(38) },
    { c:'w', s:'  ', link:'https://avancerpi.com/', linkText:'AvancerPI Solutions' },

  ],

    { c:'g',   s:'[CERT]   Nutanix NCP-MCI6 (2026–2029)  ', link:'https://www.credly.com/badges/768faa41-f6ca-4b9a-b272-47bb62dec7d2', linkText:'[view cert]' },
    { c:'g',   s:'[CERT]   GCP Associate Cloud Engineer (2025–2028)  ', link:'https://www.credly.com/badges/f857f76d-71b3-44a2-b722-b73453a713f5/public_url', linkText:'[view cert]' },
    { c:'g',   s:'[CERT]   AWS Certified Cloud Practitioner CLF-C02 (2025)  ', link:'https://www.udemy.com/certificate/UC-7499aaeb-26f7-44e9-8e5b-1833ceafc7ff/', linkText:'[view cert]' },
    { c:'g',   s:'[CERT]   Cloud Service Providers – Great Learning' },
    { c:'g',   s:'[CERT]   Intro to NoSQL Databases – Coursera' },

    { blank: true },
    { c:'y',   s:'[PAPER]  Innovative Methods of Teaching & Learning (2024)' },

  ],
  contact: [
    { c:'y b', s:'// CONTACT' },
    { c:'w',   s:'━'.repeat(38) },
    { c:'c',   s:'Email    : ', link: 'mailto:caysusdilanrodrigues@gmail.com', linkText: 'caysusdilanrodrigues@gmail.com' },
    { c:'c',   s:'LinkedIn : ', link: 'https://www.linkedin.com/in/caysus-dilan-rodrigues-913222319/', linkText: 'linkedin.com/in/caysus-dilan-rodrigues' },
    { c:'c',   s:'GitHub   : ', link: 'https://github.com/CAYSUS-DILAN', linkText: 'github.com/CAYSUS-DILAN' },
    { c:'c',   s:'Resume   : ', link: 'resume/Caysus Dilan - Cloud,Devops.pdf', linkText: 'Download PDF →' },
  ],
};

const HELP = [
  { c:'c b', s:'Available commands' },
  { c:'w',   s:'━'.repeat(38) },
  { help: true, rows: [
    ['whoami',     'Who is Caysus?'],
    ['skills',     'Technical skill set'],
    ['experience', 'Work history'],
    ['projects',   'Projects & builds'],
    ['education',  'Academic background'],
    ['certs',      'Certificates & achievements'],
    ['contact',    'Get in touch'],
    ['clear',      'Clear terminal'],
  ]},
];

const BOOT = [
  { c:'w',   s:'Establishing SSH connection...' },
  { c:'g',   s:'Connected to caysus@srv-01' },
  { blank: true },
  { c:'g b', s:"Hi 👋  Welcome. If you're lost, type 'help'." },
  { blank: true },
];

// ── Render a single data row ──────────────────────────────────────────
function mkBar(pct) {
  const f = Math.round(pct / 5), e = 20 - f;
  return `<span class="bar-g">${'█'.repeat(f)}</span><span class="bar-e">${'░'.repeat(e)}</span> <span class="dim">${pct}%</span>`;
}

function renderRow(row) {
  if (row.blank) {
    const b = document.createElement('span');
    b.className = 'line-blank';
    out.appendChild(b);
    return;
  }

  if (row.profile) {
    const span = document.createElement('span');
    span.className = 'line';
    span.innerHTML = `<div class="profile-circle"><img src="images/me.png" alt="Caysus Rodrigues"></div>`;
    out.appendChild(span);
    return;
  }

  if (row.help) {
    const wrap = document.createElement('span');
    wrap.className = 'line help-table';
    row.rows.forEach(([cmd, desc]) => {
      const r = document.createElement('span');
      r.className = 'help-row';
      r.innerHTML = `<span class="help-cmd">${cmd}</span><span class="help-desc">${desc}</span>`;
      wrap.appendChild(r);
    });
    out.appendChild(wrap);
    return;
  }

  const span = document.createElement('span');
  span.className = 'line';

  const cls = (row.c || 'w').split(' ').join(' ');

  if (row.email) {
    span.innerHTML = `<span class="${cls}">${row.s}<a href="mailto:caysusdilanrodrigues@gmail.com" style="color:var(--green);text-decoration:none;">say hello →</a></span>`;
  } else if (row.link && row.linkText && row.suffix) {
    // link with text after it (e.g. company name followed by date)
    span.innerHTML = `<span class="${cls}">${row.s}<a href="${row.link}" target="_blank" style="color:var(--cyan);text-decoration:underline;text-underline-offset:2px;">${row.linkText}</a><span class="w">${row.suffix}</span></span>`;
  } else if (row.link && row.linkText) {
    // text prefix + cyan hyperlink (works for both contact rows and cert [view cert] links)
    span.innerHTML = `<span class="${cls}">${row.s}<a href="${row.link}" target="_blank" style="color:var(--cyan);text-decoration:underline;text-underline-offset:2px;">${row.linkText}</a></span>`;
  } else if (row.link && !row.linkText) {
    span.innerHTML = `<span class="${cls}"><a href="${row.link}" target="_blank" style="color:var(--muted);text-decoration:none;">${row.s}</a></span>`;
  } else if (row.bar !== undefined) {
    span.innerHTML = `<span class="${cls}">${row.s}  ${mkBar(row.bar)}</span>`;
  } else {
    span.innerHTML = `<span class="${cls}">${row.s}</span>`;
  }

  out.appendChild(span);
}

// ── Typewrite a list of rows ──────────────────────────────────────────
function typeRows(rows, delay, cb) {
  let i = 0;
  function next() {
    if (i >= rows.length) { if (cb) cb(); return; }
    renderRow(rows[i++]);
    out.scrollTop = out.scrollHeight;
    setTimeout(next, delay);
  }
  next();
}

// ── Echo the user's command ───────────────────────────────────────────
function echoCmd(txt) {
  const span = document.createElement('span');
  span.className = 'line';
  span.innerHTML =
    `<span class="pu">caysus</span><span class="pa">@</span><span class="ph">srv-01</span>` +
    `<span class="pa">:</span><span class="pp">~</span><span class="pa">$&nbsp;</span>` +
    `<span class="w">${txt}</span>`;
  out.appendChild(span);
}

function blank() {
  const b = document.createElement('span');
  b.className = 'line-blank';
  out.appendChild(b);
}

// ── Handle command ────────────────────────────────────────────────────
function handle(raw) {
  const cmd = raw.trim().toLowerCase();
  if (!cmd) return;

  echoCmd(raw.trim());

  if (cmd === 'clear') {
    out.innerHTML = '';
    blank();
    appendLiveSessionLine();
    blank();
    const welcome = document.createElement('span');
    welcome.className = 'line';
    welcome.innerHTML = `<span class="g b">If you're lost, type 'help'.</span>`;
    out.appendChild(welcome);
    blank();
    typeRows(HELP, 32, () => { blank(); out.scrollTop = out.scrollHeight; });
    return;
  }

  if (cmd === 'help') {
    blank();
    typeRows(HELP, 35, () => { blank(); out.scrollTop = out.scrollHeight; });
    return;
  }

  if (COMMANDS[cmd]) {
    blank();
    typeRows(COMMANDS[cmd], 40, () => { blank(); out.scrollTop = out.scrollHeight; });
    return;
  }

  blank();
  const err = document.createElement('span');
  err.className = 'line';
  err.innerHTML = `<span class="r">bash: ${raw.trim()}: command not found</span>`;
  out.appendChild(err);
  const hint = document.createElement('span');
  hint.className = 'line';
  hint.innerHTML = `<span class="w">Type <span class="c">help</span> to list commands.</span>`;
  out.appendChild(hint);
  blank();
  out.scrollTop = out.scrollHeight;
}

// ── Input ─────────────────────────────────────────────────────────────
let history = [], histIdx = -1;

inp.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const v = inp.value; inp.value = ''; histIdx = -1;
    if (v.trim()) history.unshift(v.trim());
    handle(v);
  }
  if (e.key === 'ArrowUp')   { e.preventDefault(); if (histIdx < history.length-1) histIdx++; inp.value = history[histIdx] || ''; }
  if (e.key === 'ArrowDown') { e.preventDefault(); if (histIdx > 0) histIdx--; else { histIdx = -1; inp.value = ''; return; } inp.value = history[histIdx] || ''; }
  if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); out.innerHTML = ''; blank(); typeRows(HELP, 32, () => { blank(); out.scrollTop = out.scrollHeight; }); }
});

document.querySelector('.terminal').addEventListener('click', () => inp.focus());

// ── Boot ──────────────────────────────────────────────────────────────
// Boot renders first two lines, then injects live session time, then rest
const BOOT_PRE = [
  { c:'w', s:'Establishing SSH connection...' },
  { c:'g', s:'Connected to caysus@srv-01' },
];
const BOOT_POST = [
  { blank: true },
  { c:'g b', s:"Hi 👋  Welcome. If you're lost, type 'help'." },
  { blank: true },
];

typeRows(BOOT_PRE, 55, () => {
  appendLiveSessionLine();
  out.scrollTop = out.scrollHeight;
  setTimeout(() => {
    typeRows(BOOT_POST, 55, () => {
      typeRows(HELP, 32, () => { blank(); out.scrollTop = out.scrollHeight; });
    });
  }, 60);
});
</script>
